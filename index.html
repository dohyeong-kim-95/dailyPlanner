<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Planner</h1>
            <div class="date-control">
                <button class="btn-prev">◀</button>
                <span class="current-date" id="currentDate">2024-11-29</span>
                <button class="btn-next">▶</button>
            </div>
        </header>

        <main class="planner-container">
            <!-- PLAN 영역 -->
            <section class="planner-section">
                <div class="section-header">
                    <h2 class="section-title">PLAN</h2>
                    <button class="copy-all-btn" id="copyAllBtn">전체 → REAL</button>
                </div>
                <div class="time-grid" id="planGrid" data-type="plan">
                    <div class="time-labels">
                        <div class="time-header">
                            <span>00</span>
                            <span>10</span>
                            <span>20</span>
                            <span>30</span>
                            <span>40</span>
                            <span>50</span>
                        </div>
                    </div>
                    <div class="grid-content" id="planContent">
                        <!-- 시간대별 그리드 생성 -->
                    </div>
                </div>
            </section>

            <!-- 화살표 버튼 영역 -->
            <div class="copy-arrows" id="copyArrows">
                <!-- 화살표 버튼들이 동적으로 생성됨 -->
            </div>

            <!-- REAL 영역 -->
            <section class="planner-section">
                <h2 class="section-title">REAL</h2>
                <div class="time-grid" id="realGrid" data-type="real">
                    <div class="time-labels">
                        <div class="time-header">
                            <span>00</span>
                            <span>10</span>
                            <span>20</span>
                            <span>30</span>
                            <span>40</span>
                            <span>50</span>
                        </div>
                    </div>
                    <div class="grid-content" id="realContent">
                        <!-- 시간대별 그리드 생성 -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 블록 생성/수정 모달 -->
    <div class="modal" id="blockModal">
        <div class="modal-content">
            <h3>업무 입력</h3>
            <div class="form-group">
                <label for="blockTitle">업무명:</label>
                <input type="text" id="blockTitle" placeholder="업무명을 입력하세요">
            </div>
            <div class="form-group">
                <label>색상:</label>
                <div class="color-picker">
                    <button class="color-option" data-color="#FFB3BA" style="background-color: #FFB3BA;"></button>
                    <button class="color-option" data-color="#BAE1FF" style="background-color: #BAE1FF;"></button>
                    <button class="color-option" data-color="#BAFFC9" style="background-color: #BAFFC9;"></button>
                    <button class="color-option" data-color="#E0E0E0" style="background-color: #E0E0E0;"></button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancel">취소</button>
                <button class="btn-save" id="btnSave">저장</button>
            </div>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <p id="confirmMessage">확인하시겠습니까?</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnConfirmNo">아니오</button>
                <button class="btn-save" id="btnConfirmYes">예</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
