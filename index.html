<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Planner</h1>
            <div class="date-control">
                <button class="btn-prev">◀</button>
                <span class="current-date" id="currentDate"></span>
                <button class="btn-next">▶</button>
            </div>
            <div class="header-right">
                <button class="btn-export" id="btnExport">Export Day ⬇</button>
                <button class="btn-settings" id="btnSettings">⚙️</button>
            </div>
        </header>

        <main class="planner-container">
            <!-- Todo 사이드바 -->
            <aside class="todo-sidebar">
                <div class="todo-section">
                    <h3>오늘의 할 일</h3>
                    <div class="todo-list" id="todoList">
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                        <div class="todo-item" draggable="true">
                            <input type="checkbox" class="todo-checkbox">
                            <input type="text" class="todo-text" placeholder="할 일을 입력하세요">
                        </div>
                    </div>
                </div>
                <div class="journal-section">
                    <h3>오늘의 메모</h3>
                    <textarea id="journalNote" class="journal-textarea" placeholder="오늘 하루는 어땠나요?"></textarea>
                </div>
            </aside>

            <!-- PLAN 영역 -->
            <section class="planner-section">
                <div class="section-header">
                    <h2 class="section-title">PLAN</h2>
                    <button class="delete-all-btn" id="deletePlanBtn">🗑️</button>
                </div>
                <div class="time-grid" id="planGrid" data-type="plan">
                    <div class="time-labels">
                        <div class="time-header">
                            <span>00</span>
                            <span>10</span>
                            <span>20</span>
                            <span>30</span>
                            <span>40</span>
                            <span>50</span>
                        </div>
                    </div>
                    <div class="grid-content" id="planContent">
                        <!-- 시간대별 그리드 생성 -->
                    </div>
                </div>
            </section>

            <!-- 화살표 버튼 영역 -->
            <div class="copy-arrows" id="copyArrows">
                <button class="arrow-btn copy-all-btn-arrow" id="copyAllBtn" title="전체 → REAL">→</button>
            </div>

            <!-- REAL 영역 -->
            <section class="planner-section">
                <div class="section-header">
                    <h2 class="section-title">REAL</h2>
                    <button class="delete-all-btn" id="deleteRealBtn">🗑️</button>
                </div>
                <div class="time-grid" id="realGrid" data-type="real">
                    <div class="time-labels">
                        <div class="time-header">
                            <span>00</span>
                            <span>10</span>
                            <span>20</span>
                            <span>30</span>
                            <span>40</span>
                            <span>50</span>
                        </div>
                    </div>
                    <div class="grid-content" id="realContent">
                        <!-- 시간대별 그리드 생성 -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 블록 생성/수정 모달 -->
    <div class="modal" id="blockModal">
        <div class="modal-content">
            <h3>업무 입력</h3>
            <div class="form-group">
                <label for="blockTitle">업무명:</label>
                <input type="text" id="blockTitle" placeholder="업무명을 입력하세요">
            </div>
            <div class="form-group">
                <label>색상:</label>
                <div class="color-picker">
                    <button class="color-option" data-color="#FFB3BA" style="background-color: #FFB3BA;"></button>
                    <button class="color-option" data-color="#BAE1FF" style="background-color: #BAE1FF;"></button>
                    <button class="color-option" data-color="#BAFFC9" style="background-color: #BAFFC9;"></button>
                    <button class="color-option" data-color="#E0E0E0" style="background-color: #E0E0E0;"></button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnCancel">취소</button>
                <button class="btn-save" id="btnSave">저장</button>
            </div>
        </div>
    </div>

    <!-- 확인 모달 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <p id="confirmMessage">확인하시겠습니까?</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnConfirmNo">아니오</button>
                <button class="btn-save" id="btnConfirmYes">예</button>
            </div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>설정</h3>
            <div class="form-group">
                <label>Export 형식:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="exportFormat" value="json" checked>
                        JSON만
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="exportFormat" value="both">
                        JSON + Markdown
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label>색상 카테고리:</label>
                <div class="color-categories">
                    <div class="color-category">
                        <div class="color-swatch" style="background-color: #E0E0E0;"></div>
                        <span>회색 = 수면</span>
                    </div>
                    <div class="color-category">
                        <div class="color-swatch" style="background-color: #BAE1FF;"></div>
                        <span>파랑 = 업무</span>
                    </div>
                    <div class="color-category">
                        <div class="color-swatch" style="background-color: #BAFFC9;"></div>
                        <span>초록 = 휴식</span>
                    </div>
                    <div class="color-category">
                        <div class="color-swatch" style="background-color: #FFB3BA;"></div>
                        <span>빨강 = 기타</span>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btnSettingsClose">닫기</button>
            </div>
        </div>
    </div>

    <!-- Toast 알림 -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
